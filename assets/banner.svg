<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jack Jeffery — full-stack developer">
  <title>Jack Jeffery — full-stack developer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <filter id="nameGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- ambient glows -->
  <ellipse cx="180" cy="90" rx="300" ry="200" fill="url(#glow1)" filter="url(#soft)" opacity="0.5">
    <animate attributeName="opacity" values="0.35;0.6;0.35" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1040" cy="250" rx="320" ry="210" fill="url(#glow2)" filter="url(#soft)" opacity="0.5">
    <animate attributeName="opacity" values="0.55;0.3;0.55" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <!-- top + bottom accent rules -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  <rect x="0" y="317" width="1200" height="3" fill="url(#accent)" opacity="0.55"/>

  <!-- monogram -->
  <g transform="translate(96,160)">
    <circle r="46" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9"/>
    <circle r="46" fill="#6366f1" opacity="0.07"/>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="middle"
          font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700"
          fill="url(#accent)" letter-spacing="1">JJ</text>
    <circle r="52" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.35">
      <animate attributeName="r" values="50;58;50" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- name -->
  <text x="180" y="146"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="60" font-weight="800" letter-spacing="-1"
        fill="url(#nameGrad)" filter="url(#nameGlow)">
    Jack Jeffery
  </text>

  <!-- role line -->
  <text x="182" y="188"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="21" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Full-stack developer
  </text>
  <text x="398" y="188"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="21" font-weight="700" fill="url(#accent)">·</text>
  <text x="414" y="188"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="21" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Python &amp; JavaScript
  </text>
  <text x="630" y="188"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="21" font-weight="700" fill="url(#accent)">·</text>
  <text x="646" y="188"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="21" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    UCS
  </text>

  <!-- typed tagline -->
  <g font-family="'JetBrains Mono','Consolas',monospace" font-size="17" fill="#64748b">
    <text x="182" y="240">
      <tspan fill="#22d3ee">&gt;</tspan>
      <tspan> building systems end to end
        <animate attributeName="opacity" values="0;1;1;1;1" keyTimes="0;0.05;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
      </tspan>
      <tspan fill="url(#accent)" font-weight="700">
        ▍
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
      </tspan>
    </text>
  </g>

  <!-- footer label -->
  <text x="182" y="278"
        font-family="'JetBrains Mono','Consolas',monospace" font-size="13"
        fill="#475569" letter-spacing="2.4">CYBER RANGE · WEB PLATFORMS · DISCORD AUTOMATION</text>
</svg>
