    <linearGradient id="vName" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0f0f5"/>
      <stop offset="55%" stop-color="#c7c9f5"/>
      <stop offset="100%" stop-color="#a78bfa"/>
